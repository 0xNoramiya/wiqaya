<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wiqaya — Login</title>
  <style>
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 2rem; max-width: 28rem; }
    p { font-size: 1.1rem; }
    .sub { font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem; line-height: 1.5; }
    .gold { color: #D4AF37; }
  </style>
</head>
<body>
  <div class="card">
    <p id="status" class="gold">Completing login…</p>
    <p class="sub" id="sub">Please wait</p>
  </div>
  <script>
    // Stable extension ID, derived from the public key pinned in manifest.json.
    // Must be kept in sync with the `key` field there.
    const EXT_ID = 'dchhlgpkmagjfobpbkligiaickfklbnn';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    const statusEl = document.getElementById('status');
    const subEl = document.getElementById('sub');

    function fail(msg, detail) {
      statusEl.textContent = msg;
      statusEl.classList.remove('gold');
      subEl.textContent = detail || '';
    }

    function success() {
      statusEl.textContent = 'Logged in successfully';
      subEl.textContent = 'You can close this tab and return to Wiqaya.';
    }

    if (error) {
      fail('Login failed', params.get('error_description') || error);
    } else if (!code || !state) {
      fail('Login error', 'Missing authorization parameters in the redirect URL.');
    } else if (!chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
      fail('Login received', 'Open this page in Chrome with the Wiqaya extension installed to complete login.');
    } else {
      try {
        chrome.runtime.sendMessage(
          EXT_ID,
          { type: 'AUTH_CALLBACK', code: code, state: state },
          function (response) {
            if (chrome.runtime.lastError) {
              fail('Could not connect to the Wiqaya extension', chrome.runtime.lastError.message);
              return;
            }
            if (response && response.success) {
              success();
            } else {
              fail('Login failed', (response && response.error) || 'The extension rejected the authorization code.');
            }
          }
        );
      } catch (e) {
        fail('Could not connect to the Wiqaya extension', String(e));
      }
    }
  </script>
</body>
</html>
